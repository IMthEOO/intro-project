<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work!</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css"
    />
    <script type="module" src="js/start.js"></script>
  </head>
  <body>
    <nav class="sidebar">
      <div class="logo">
        <h2>Logo</h2>
      </div>

      <div class="nav-links">
        <h3>General</h3>

        <div class="link">
          <div class="link-icon"><i class="iconoir-compass"></i></div>
          <div class="link-text">Dashboard</div>
        </div>

        <div class="link active">
          <div class="link-icon"><i class="iconoir-group"></i></div>
          <div class="link-text">People</div>
        </div>

        <div class="link">
          <div class="link-icon"><i class="iconoir-building"></i></div>
          <div class="link-text">Buildings</div>
        </div>

        <div class="link">
          <div class="link-icon"><i class="iconoir-user-badge-check"></i></div>
          <div class="link-text">Landlords</div>
        </div>

        <div class="link">
          <div class="link-icon"><i class="iconoir-house-rooms"></i></div>
          <div class="link-text">Rooms</div>
        </div>
      </div>
    </nav>

    <div id="content">
      <main>
        <!-- <h1>Welcome</h1> -->

        <div class="page-heading">
          <h2>People</h2>
          <button id="addperson"><i class="iconoir-plus"></i>Add Person</button>
        </div>
        <div class="table-wrapper">
          <div class="table-controls">
            <div class="search">
              <i class="iconoir-search"></i>
              <input type="text" name="search-box" placeholder="Search" />
            </div>

            <div class="btn-group">
              <button class="controls-btn">
                <i class="iconoir-filter-list"></i> Filter
              </button>
              <button class="controls-btn">
                <i class="iconoir-sort"></i> Sort
              </button>
            </div>
          </div>
          <table id="peopletable">
            <thead>
              <tr>
                <th>Name</th>
                <th colspan="7">Schedule</th>
                <th>Action</th>
              </tr>
              <tr class="days">
                <th></th>
                <th class="day-1"></th>
                <th class="day-2"></th>
                <th class="day-3"></th>
                <th class="day-4"></th>
                <th class="day-5"></th>
                <th class="day-6"></th>
                <th class="day-7"></th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>

      <!--        <footer>
            <p>&copy; 2024 babblevoice. All rights reserved.</p>
        </footer> -->
    </div>

    <!-- Forms-->
    <div id="personform" class="popup" style="display: none">
      <form>
        <h2>Person</h2>
        <div class="form-group">
          <label for="personform-name">Name</label>
          <input type="text" id="personform-name" />
        </div>
        <div class="form-group">
          <label for="personform-email">Email</label>
          <input type="email" id="personform-email" />
        </div>
        <div class="form-group">
          <label for="personform-notes">Notes</label>
          <textarea id="personform-notes" rows="4"></textarea>
        </div>

        <div class="action-btn-group">
          <button type="submit">Save</button>
          <button class="close btn-secondary" type="button">Close</button>
        </div>

        
      </form>
    </div>

    <div id="workflowform" class="popup" style="display: none">
      <form>
        <h2>Workflow</h2>
        <div class="form-group">
          <label for="workflowform-name">Name</label>
          <input type="text" id="workflowform-name" />
        </div>
        <div class="form-group">
          <label for="workflowform-notes">Notes</label>
          <textarea id="workflowform-notes" rows="4"></textarea>
        </div>
        <button type="submit">Save</button>
        <button class="close" type="button">Close</button>
      </form>
    </div>

    <div id="workflowstepsform" class="popup" style="display: none">
      <form>
        <h2>Workflow Steps</h2>
        <div class="form-group">
          <label for="workflowform-name">Name</label>
          <input type="text" id="workflowform-name" readonly />
        </div>

        <div class="ganttchart">
          <div class="gantttask" style="width: 30%; left: 0%; top: 0%">
            Task 1
          </div>
          <div class="gantttask" style="width: 40%; left: 30%; top: 20%">
            Task 2
          </div>
          <!-- Add more tasks as needed -->
        </div>

        <button type="button">Add</button>
        <button class="close" type="button">Close</button>
      </form>
    </div>
  </body>
</html>
